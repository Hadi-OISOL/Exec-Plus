# Use case: Runs the local control-plane database and S3-compatible object storage.
# What it does: Provides reproducible development infrastructure without selecting a vector database prematurely.

name: execplus

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: execplus
      POSTGRES_USER: execplus
      POSTGRES_PASSWORD: execplus
    ports:
      - "127.0.0.1:${EXECPLUS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - execplus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U execplus -d execplus"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: execplus
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - execplus-minio:/data

volumes:
  execplus-postgres:
  execplus-minio:

