# Use case: Defines the Python workspace, backend dependencies, and quality-tool configuration.
# What it does: Makes the ExecPlus API installable and provides consistent pytest, Ruff, and mypy behavior.

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "execplus"
version = "0.1.0"
description = "Verified conversational analytics for structured business data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "boto3>=1.35,<2",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7,<1",
  "fastapi>=0.111,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "boto3-stubs[s3]>=1.35,<2",
  "types-openpyxl>=3.1,<4",
  "types-defusedxml>=0.7,<1",
  "mypy>=1.10,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/execplus"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-config --strict-markers --disable-warnings -q"
pythonpath = ["apps/api/src"]
testpaths = ["apps/api/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["apps/api/src", "apps/api/tests", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["execplus"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["apps/api/src", "migrations", "scripts"]
mypy_path = "apps/api/src"
