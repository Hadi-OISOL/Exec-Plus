# Use case: Deploys the private eight-user demo with independently movable services.
# What it does: Persists project data on sdb and exposes services only through loopback tunnels.

name: oisol-execplus

x-api: &api
  image: oisol-execplus/api:demo
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
    args:
      PYTHON_IMAGE: public.ecr.aws/docker/library/python:3.12-slim@sha256:f77ac9e44ae96ef2c90b8053ea08c31f8be030f824196b0ae4db6d462c84e51f
  network_mode: host
  env_file: /sdb-disk/OISOL_ExecPLUS/secrets/app.env
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=1g,mode=1777"]
  mem_limit: 4g
  cpus: 8
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    env_file: /sdb-disk/OISOL_ExecPLUS/secrets/database.env
    ports: ["127.0.0.1:18432:5432"]
    volumes:
      - type: bind
        source: /sdb-disk/OISOL_ExecPLUS/postgres
        target: /var/lib/postgresql/data
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U execplus -d execplus"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    cpus: 2
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address :9001
    env_file: /sdb-disk/OISOL_ExecPLUS/secrets/storage.env
    ports: ["127.0.0.1:18490:9000", "127.0.0.1:18491:9001"]
    volumes:
      - type: bind
        source: /sdb-disk/OISOL_ExecPLUS/objects
        target: /data
        bind: {create_host_path: false}
    mem_limit: 2g
    cpus: 2
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  api:
    <<: *api
    restart: unless-stopped
    command: [uvicorn, execplus.main:app, --host, 127.0.0.1, --port, "18401", --workers, "2", --no-access-log]
    depends_on:
      postgres: {condition: service_healthy}
      storage: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18401/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 4

  jobs:
    <<: *api
    restart: unless-stopped
    command: [python, -m, execplus.manage, process-jobs, --watch, --concurrency, "4", --poll-seconds, "0.5"]
    stop_grace_period: 120s
    mem_limit: 2g
    cpus: 4
    depends_on:
      api: {condition: service_healthy}

  operator:
    <<: *api
    profiles: [operator]
    user: "1000:1000"
    volumes:
      - /sdb-disk/OISOL_ExecPLUS/secrets:/run/execplus-demo
    command: [python, -m, alembic, upgrade, head]

  web:
    image: oisol-execplus/web:demo
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: public.ecr.aws/docker/library/node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
        NEXT_PUBLIC_API_URL: http://localhost:18401
    restart: unless-stopped
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: "18400"
      NEXT_TELEMETRY_DISABLED: "1"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    mem_limit: 1g
    cpus: 2
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
