# Use case: Restricts the dedicated demo SSH identity to the two application forwards.
# What it does: Disables shells, password login, remote forwarding and access to other service ports.

Match User execplus-demo
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:18400 127.0.0.1:18401
    PermitListen none
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/bin/false
Match all
